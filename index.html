<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xx-page-play</title>
  <script type="importmap">
  {
    "imports": {
      "preact": "https://cdn.jsdelivr.net/npm/preact@10.19.3/dist/preact.module.js",
      "preact/hooks": "https://cdn.jsdelivr.net/npm/preact@10.19.3/hooks/dist/hooks.module.js"
    }
  }
  </script>
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-card: rgba(255,255,255,0.04);
      --accent: #6366f1;
      --accent2: #a855f7;
      --accent3: #ec4899;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: rgba(255,255,255,0.08);
      --radius: 14px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(80px); opacity: 0.3;
      animation: float 12s ease-in-out infinite;
      pointer-events: none; z-index: 0;
    }
    .orb-1 { width: 500px; height: 500px; background: var(--accent); top: -150px; left: -100px; animation-delay: 0s; }
    .orb-2 { width: 400px; height: 400px; background: var(--accent2); top: 30%; right: -120px; animation-delay: -4s; animation-duration: 15s; }
    .orb-3 { width: 350px; height: 350px; background: var(--accent3); bottom: -100px; left: 30%; animation-delay: -8s; animation-duration: 18s; }
    @keyframes float {
      0%, 100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(40px,-60px) scale(1.05); }
      66% { transform: translate(-30px,40px) scale(0.95); }
    }

    .grid {
      position: fixed; inset: 0;
      background-image: linear-gradient(rgba(99,102,241,0.04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(99,102,241,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 0; pointer-events: none;
    }

    .noise {
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }

    #cursor-glow {
      position: fixed; width: 320px; height: 320px; border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%);
      pointer-events: none; transform: translate(-50%,-50%); z-index: 0;
    }

    main {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 4rem 2rem;
    }

    .hero { text-align: center; max-width: 800px; }

    .hero-label {
      display: inline-block; font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--accent); background: rgba(99,102,241,0.1);
      border: 1px solid rgba(99,102,241,0.3); padding: 0.4em 1.2em;
      border-radius: 999px; margin-bottom: 2rem;
      animation: fadeUp 0.8s ease both;
    }

    .hero-title {
      font-size: clamp(3rem, 10vw, 7rem); font-weight: 800; line-height: 1;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #fff 0%, #a855f7 50%, #ec4899 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeUp 0.8s 0.1s ease both;
    }

    .hero-sub {
      font-size: clamp(1rem, 2.5vw, 1.25rem); color: var(--muted);
      margin-top: 1.5rem; line-height: 1.7;
      animation: fadeUp 0.8s 0.2s ease both;
    }
    .hero-sub em { color: var(--text); font-style: normal; }

    .tags {
      display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center;
      margin-top: 3rem; animation: fadeUp 0.8s 0.3s ease both;
    }
    .tag {
      font-size: 0.75rem; padding: 0.3em 0.8em; border-radius: 6px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: var(--muted); letter-spacing: 0.05em;
    }

    .line {
      width: 60px; height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
      border-radius: 2px; margin: 4rem auto;
      animation: growX 1s 0.5s ease both;
    }

    .section-wrap { width: 100%; max-width: 900px; animation: fadeUp 0.8s 0.6s ease both; }
    .section-title {
      font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 1rem; font-style: italic;
    }

    .stats {
      display: flex; gap: 3rem; justify-content: center;
      margin-bottom: 4rem;
    }
    .stat { text-align: center; }
    .stat-num {
      font-size: 2.5rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-label {
      font-size: 0.7rem; color: var(--muted); margin-top: 0.3rem;
      text-transform: uppercase; letter-spacing: 0.1em;
    }

    .widget {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 2rem;
    }
    .widget + .widget { margin-top: 1.5rem; }
    .widget-title {
      font-size: 0.9rem; font-weight: 700; margin-bottom: 1.5rem;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .widget-title span { font-size: 1.2rem; }

    .tabs-nav {
      display: flex; gap: 4px; margin-bottom: 1.5rem;
      background: rgba(255,255,255,0.04); padding: 4px;
      border-radius: 10px; border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1; padding: 0.5em 1em; border-radius: 8px;
      border: none; background: transparent; color: var(--muted);
      font-family: inherit; font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
    }
    .tab-btn.active { background: rgba(99,102,241,0.2); color: var(--text); }
    .tab-content {
      background: rgba(99,102,241,0.05); border: 1px solid var(--border);
      border-radius: 10px; padding: 1.5rem; font-size: 0.85rem;
      color: var(--muted); line-height: 1.8;
    }
    .tab-content strong { color: var(--text); }

    .todo-input-row { display: flex; gap: 8px; margin-bottom: 1rem; }
    .todo-input {
      flex: 1; padding: 0.6em 1em; border-radius: 8px;
      background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      color: var(--text); font-family: inherit; font-size: 0.85rem; outline: none;
      transition: border-color 0.2s;
    }
    .todo-input:focus { border-color: var(--accent); }
    .todo-input::placeholder { color: var(--muted); }
    .todo-add-btn {
      padding: 0.6em 1.2em; border-radius: 8px; border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; font-family: inherit; font-size: 0.85rem;
      cursor: pointer; font-weight: 600; transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 0 20px rgba(99,102,241,0.25);
    }
    .todo-add-btn:hover { transform: translateY(-1px); box-shadow: 0 0 30px rgba(99,102,241,0.4); }
    .todo-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .todo-item {
      display: flex; align-items: center; gap: 10px;
      padding: 0.6em 1em; border-radius: 8px;
      background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      font-size: 0.85rem; transition: all 0.2s;
    }
    .todo-item:hover { background: rgba(255,255,255,0.06); }
    .todo-item.done { opacity: 0.4; text-decoration: line-through; }
    .todo-item-text { flex: 1; cursor: pointer; }
    .todo-del {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 0.75rem; padding: 0.2em 0.5em;
      border-radius: 4px; transition: color 0.2s, background 0.2s;
    }
    .todo-del:hover { color: #ef4444; background: rgba(239,68,68,0.1); }
    .todo-empty { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.8rem; }

    .counter-row { display: flex; align-items: center; justify-content: center; gap: 1.5rem; }
    .counter-btn {
      width: 44px; height: 44px; border-radius: 10px;
      border: 1px solid var(--border); background: rgba(255,255,255,0.04);
      color: var(--text); font-size: 1.2rem; cursor: pointer;
      transition: all 0.15s; display: flex; align-items: center; justify-content: center;
    }
    .counter-btn:hover { background: rgba(99,102,241,0.15); border-color: var(--accent); transform: scale(1.05); }
    .counter-btn:active { transform: scale(0.95); }
    .counter-display {
      font-size: 3rem; font-weight: 800; min-width: 80px; text-align: center;
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .counter-btns-row { display: flex; gap: 8px; justify-content: center; margin-top: 1rem; }
    .counter-step-btn {
      padding: 0.4em 1em; border-radius: 6px;
      border: 1px solid var(--border); background: rgba(255,255,255,0.03);
      color: var(--muted); font-family: inherit; font-size: 0.75rem;
      cursor: pointer; transition: all 0.15s;
    }
    .counter-step-btn:hover { color: var(--text); background: rgba(255,255,255,0.08); }

    .cta { margin-top: 4rem; animation: fadeUp 0.8s 0.8s ease both; }
    .btn-group { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.9em 2em; border-radius: 10px; font-size: 0.9rem;
      font-weight: 600; text-decoration: none; color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 30px rgba(99,102,241,0.3);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 0 50px rgba(99,102,241,0.5); }
    .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.15); box-shadow: none; }
    .btn-outline:hover { background: rgba(255,255,255,0.05); box-shadow: none; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes growX {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.6s, transform 0.6s; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    #app { width: 100%; }
  </style>
</head>
<body>
  <div id="cursor-glow"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="grid"></div>
  <div class="noise"></div>

  <main>
    <section class="hero">
      <span class="hero-label">⚡ Static &middot; Preact &middot; Zero Deps</span>
      <h1 class="hero-title">xx-page-play</h1>
      <p class="hero-sub">
        Preact 交互组件 &middot; 纯静态直出 &middot; 极小体积<br/>
        <em>Real JS power, no build step.</em>
      </p>
      <div class="tags">
        <span class="tag">Preact</span>
        <span class="tag">HTML5</span>
        <span class="tag">CSS3</span>
        <span class="tag">Vanilla JS</span>
        <span class="tag">零构建</span>
        <span class="tag">Lighthouse 100</span>
      </div>
    </section>

    <div class="line"></div>

    <div id="app"></div>

    <div class="cta">
      <div class="btn-group">
        <a href="https://github.com/shawxu/xx-page-play" class="btn" target="_blank">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
          View on GitHub
        </a>
        <span class="btn btn-outline">MIT License &middot; 已开源</span>
      </div>
    </div>
  </main>

  <script type="module">
    import { h, render } from 'preact';
    import { useState, useEffect } from 'preact/hooks';

    // ── Tabs ──────────────────────────────────────────────────────────────────
    function Tabs() {
      const [active, setActive] = useState(0);
      const tabs = [
        {
          label: '⚡ 性能',
          content: [
            h('strong', null, '仅 3KB'),
            ' 依赖体积，比 React 小 7 倍。ESM CDN 直出，浏览器原生模块解析，无打包、无压缩、零混淆。'
          ]
        },
        {
          label: '🎯 精准',
          content: [
            '与 React 完全兼容的 API，支持 hooks、context、Suspense。使用标准 ',
            h('strong', null, 'Web Components'),
            ' 自定义元素方式输出，可嵌入任意页面。'
          ]
        },
        {
          label: '🔥 灵活',
          content: [
            '可与 jQuery、Vue、原生 DOM 并存。渐进式增强，不强求全有全无。一个 ',
            h('strong', null, 'import'),
            ' 引入，立即获得完整的响应式能力。'
          ]
        },
      ];
      return h('div', { class: 'widget' },
        h('div', { class: 'widget-title' },
          h('span', null, '🏷'), ' Preact 特性'
        ),
        h('div', { class: 'tabs-nav' },
          tabs.map((t, i) => h('button', {
            class: 'tab-btn' + (i === active ? ' active' : ''),
            onClick: () => setActive(i),
            key: i
          }, t.label))
        ),
        h('div', { class: 'tab-content' }, tabs[active].content)
      );
    }

    // ── Counter ─────────────────────────────────────────────────────────────
    function Counter() {
      const [count, setCount] = useState(0);
      const steps = [-100, -10, -1, 1, 10, 100];
      return h('div', { class: 'widget' },
        h('div', { class: 'widget-title' },
          h('span', null, '⚙️'), ' 数字调节器'
        ),
        h('div', { class: 'counter-row' },
          h('button', { class: 'counter-btn', onClick: () => setCount(c => c - 1) }, '−'),
          h('div', { class: 'counter-display' }, count),
          h('button', { class: 'counter-btn', onClick: () => setCount(c => c + 1) }, '+')
        ),
        h('div', { class: 'counter-btns-row' },
          steps.map(n => h('button', {
            class: 'counter-step-btn', onClick: () => setCount(c => c + n), key: n
          }, n > 0 ? '+' + n : n))
        )
      );
    }

    // ── Todo ────────────────────────────────────────────────────────────────
    function Todo() {
      const [items, setItems] = useState([
        { id: 1, text: '尝试 Preact 交互组件', done: false },
        { id: 2, text: '零构建直接跑起来', done: true },
        { id: 3, text: '部署到 GitHub Pages', done: false },
      ]);
      const [val, setVal] = useState('');

      const add = () => {
        if (!val.trim()) return;
        setItems(it => [...it, { id: Date.now(), text: val.trim(), done: false }]);
        setVal('');
      };
      const toggle = id => setItems(it => it.map(i => i.id === id ? Object.assign({}, i, { done: !i.done }) : i));
      const del = id => setItems(it => it.filter(i => i.id !== id));

      return h('div', { class: 'widget' },
        h('div', { class: 'widget-title' },
          h('span', null, '📋'), ' 待办事项'
        ),
        h('div', { class: 'todo-input-row' },
          h('input', {
            class: 'todo-input', value: val,
            placeholder: '输入任务，按 Enter 或点击添加...',
            onInput: e => setVal(e.target.value),
            onKeyDown: e => e.key === 'Enter' && add()
          }),
          h('button', { class: 'todo-add-btn', onClick: add }, '添加')
        ),
        h('ul', { class: 'todo-list' },
          items.length === 0 && h('li', { class: 'todo-empty' }, '暂无任务，全部完成了？🎉'),
          items.map(item => h('li', { class: 'todo-item' + (item.done ? ' done' : ''), key: item.id },
            h('span', { class: 'todo-item-text', onClick: () => toggle(item.id) }, item.text),
            h('button', { class: 'todo-del', onClick: () => del(item.id) }, '✕')
          ))
        )
      );
    }

    // ── App ───────────────────────────────────────────────────────────────────
    function App() {
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = document.querySelector('.section-wrap');
        if (!el) return;
        const obs = new IntersectionObserver(([e]) => e.isIntersecting && setVisible(true), { threshold: 0.1 });
        obs.observe(el);
        return () => obs.disconnect();
      }, []);

      return h('div', { class: 'section-wrap' + (visible ? '' : ' reveal') },
        h('div', { class: 'section-title' }, '// Interactive Preact Components'),
        h(Tabs),
        h(Counter),
        h(Todo)
      );
    }

    render(h(App), document.getElementById('app'));
  </script>

  <script>
    const glow = document.getElementById('cursor-glow');
    document.addEventListener('mousemove', e => {
      glow.style.left = e.clientX + 'px';
      glow.style.top = e.clientY + 'px';
    });

    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => e.isIntersecting && (e.target.classList.add('visible'), obs.unobserve(e.target)));
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
  </script>
</body>
</html>
